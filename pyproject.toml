[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "A travel decision assistant built from a real planning problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2,<0.3",
    "kiwipiepy>=0.20,<1",
    "sentence-transformers>=3,<6",
    "lxml>=6.1.3,<7",
    "trafilatura>=2.3.1,<3",
    "curl-cffi>=0.16.3,<0.17",
]

[project.optional-dependencies]
search-research = ["ddgs==9.16.0"]
google-http = ["curl-cffi>=0.16.3,<0.17", "lxml>=6.1.3,<7"]
google-http-js = ["curl-cffi>=0.16.3,<0.17", "lxml>=6.1.3,<7", "quickjs==1.19.4"]
webserp = ["webserp @ git+https://github.com/PaperBoardOfficial/webserp.git@e13148334995745f104a69ce7127179785ee741e"]

[project.scripts]
travel-agent = "travel_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
