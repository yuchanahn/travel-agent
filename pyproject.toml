[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "A travel decision assistant built from a real planning problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
travel-agent = "travel_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
