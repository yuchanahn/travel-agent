[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "A travel decision assistant built from a real planning problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2,<0.3",
    "kiwipiepy>=0.20,<1",
    "sentence-transformers>=3,<6",
    "ddgs>=9,<10",
]

[project.optional-dependencies]
browser = ["playwright>=1.64,<2"]
webserp = ["webserp @ git+https://github.com/PaperBoardOfficial/webserp.git@e13148334995745f104a69ce7127179785ee741e"]

[project.scripts]
travel-agent = "travel_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
