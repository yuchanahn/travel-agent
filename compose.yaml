name: travel-agent-lab
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_UI_PORT:-}:8000"
    environment:
      TZ: Asia/Seoul
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      AGENT_CONTEXT_TOKENS: ${AGENT_CONTEXT_TOKENS:-65536}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-4096}
      WEB_CONTEXT_COMPACT_BYTES: ${WEB_CONTEXT_COMPACT_BYTES:-32000}
      WEB_CONTEXT_KEEP_TURNS: ${WEB_CONTEXT_KEEP_TURNS:-2}
      WEB_SEARCH_PROVIDER: brave
      WEB_SEARCH_BACKEND: brave
      BRAVE_API_KEY_FILE: /run/secrets/brave_api_key
    secrets:
      - brave_api_key
    volumes:
      - web_runs:/app/data/private/web
    restart: unless-stopped
secrets:
  brave_api_key:
    file: ./data/private/brave-api-key
volumes:
  web_runs:
